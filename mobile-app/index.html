<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#EAE2D4"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png"/>
<title>Atelier · Mobile Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bone:#F4EFE6;--bone-deep:#EAE2D4;--paper:#FBF8F2;
  --ink:#1C1B17;--ink-soft:#3A382F;--mute:#8B8676;--mute-lite:#B8B2A1;
  --line:#D8D0BE;--olive:#3D4A2A;--olive-deep:#2A3420;--clay:#B85C3A;
  --sand:#D9C9A8;--sky:#A8B5B0;--dark:#1C1B17;
}
html,body{height:100%;background:var(--bone-deep);font-family:'Inter',sans-serif;color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
textarea,input{font-family:inherit}

/* ── Shell ──────────────────────────────────────────────────────────── */
#shell{
  width:100%;max-width:430px;margin:0 auto;height:100dvh;min-height:100svh;
  position:relative;overflow:hidden;background:var(--paper);
  display:flex;flex-direction:column;
  box-shadow:0 0 80px rgba(0,0,0,0.18);
}
#shell.dark-shell{background:var(--dark)}

/* ── Status bar ─────────────────────────────────────────────────────── */
#status-bar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:13px 24px 4px;height:44px;font-size:12px;font-weight:500;
  font-family:'JetBrains Mono',monospace;color:var(--ink);transition:color .2s;
}
#status-bar.dark{color:var(--paper)}

/* ── View ───────────────────────────────────────────────────────────── */
#view{
  flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  position:relative;min-height:0;
}

/* ── Tab bar ────────────────────────────────────────────────────────── */
#tab-bar{
  flex-shrink:0;display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,22px);
  background:rgba(251,248,242,0.92);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid var(--line);
}
#tab-bar.hidden{display:none}
.tab-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 16px;background:none;border:none;color:var(--mute);
  -webkit-tap-highlight-color:transparent;position:relative;
}
.tab-btn.active{color:var(--ink)}
.tab-label{font-size:10px;letter-spacing:.1px;transition:color .15s}
.tab-badge{
  position:absolute;top:0;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--clay);border:1.5px solid var(--paper);
}

/* ── Typography ─────────────────────────────────────────────────────── */
.serif{font-family:'Instrument Serif',serif}
.mono{font-family:'JetBrains Mono',monospace}
.anno{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--mute)}

/* ── Blueprint grid ─────────────────────────────────────────────────── */
.blueprint{
  background-color:var(--bone-deep);
  background-image:linear-gradient(rgba(61,74,42,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(61,74,42,.06) 1px,transparent 1px);
  background-size:24px 24px;
}

/* ── Mob nav ────────────────────────────────────────────────────────── */
.mob-nav{
  display:flex;align-items:center;gap:12px;padding:6px 20px 12px;
  min-height:56px;flex-shrink:0;
  border-bottom:.5px solid var(--line);background:var(--paper);
}
.mob-nav.dark{border-bottom-color:rgba(255,255,255,.08);background:transparent}
.mob-nav-title{font-family:'Instrument Serif',serif;font-size:22px;line-height:1.15;
  color:var(--ink);transition:color .2s}
.mob-nav.dark .mob-nav-title{color:var(--paper)}
.mob-nav-sub{font-family:'JetBrains Mono',monospace;font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:2px}
.mob-nav.dark .mob-nav-sub{color:rgba(255,255,255,.45)}

.back-btn{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:#fff;border:1px solid var(--line);
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.back-btn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}

/* ── Buttons ────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;
  border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.02em;
  transition:opacity .15s,transform .1s,background .15s;padding:10px 20px;
  -webkit-tap-highlight-color:transparent;
}
.btn:active:not(:disabled){transform:scale(.96);opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-olive{background:var(--olive);color:var(--paper);border-color:var(--olive-deep);
  box-shadow:0 2px 8px rgba(61,74,42,.25)}
.btn-olive:not(:disabled):hover{background:var(--olive-deep)}
.btn-clay{background:var(--clay);color:var(--paper);border-color:#A24E2E;
  box-shadow:0 4px 12px rgba(184,92,58,.3)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:not(:disabled):hover{background:rgba(28,27,23,.04)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-lg{padding:14px 26px;font-size:14px}
.btn-full{width:100%;justify-content:center}

/* ── Cards ──────────────────────────────────────────────────────────── */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  transition:border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent;
}
.card.active,.card:active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.card-tap{cursor:pointer}
.card-tap:active{opacity:.85}

/* ── Upload zone ────────────────────────────────────────────────────── */
.upload-zone{
  border:1.5px dashed var(--mute-lite);border-radius:16px;aspect-ratio:4/3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:var(--paper);cursor:pointer;text-align:center;
  padding:24px;position:relative;overflow:hidden;
}
.upload-zone.filled{border-style:solid;border-color:var(--line);cursor:default}
.upload-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ── Shelf ──────────────────────────────────────────────────────────── */
.shelf{
  display:flex;gap:8px;padding:12px 16px env(safe-area-inset-bottom,20px);
  background:rgba(28,27,23,.96);border-top:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.shelf-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);color:var(--paper);font-size:11px;font-weight:500;
  -webkit-tap-highlight-color:transparent;
}
.shelf-btn.primary-shelf{background:var(--clay);border-color:#A24E2E}
.shelf-btn:active:not(:disabled){transform:scale(.96);opacity:.75}
.shelf-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── Bottom sheet ───────────────────────────────────────────────────── */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;
  animation:fadeIn .2s ease;
}
.sheet{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;max-height:78vh;background:var(--paper);
  border-radius:20px 20px 0 0;z-index:51;display:flex;flex-direction:column;
  box-shadow:0 -20px 50px rgba(0,0,0,.25);
  animation:slideUp .26s cubic-bezier(.2,.9,.3,1);
}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:2px;
  margin:10px auto 0;flex-shrink:0}
.sheet-header{display:flex;align-items:flex-start;justify-content:space-between;
  padding:12px 20px 6px;flex-shrink:0}
.sheet-body{flex:1;overflow-y:auto;padding:8px 20px 32px;-webkit-overflow-scrolling:touch}
.sheet-close{
  width:30px;height:30px;border-radius:50%;background:var(--bone);border:none;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── Inputs ─────────────────────────────────────────────────────────── */
.inp{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  font-size:15px;color:var(--ink);background:var(--paper);outline:none;
  transition:border-color .15s;resize:none;
}
.inp:focus{border-color:var(--ink)}

/* ── Spinner ────────────────────────────────────────────────────────── */
.spin{
  border:2px solid transparent;border-top-color:currentColor;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;
}

/* ── Ref grid ───────────────────────────────────────────────────────── */
.refs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref-thumb{
  aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bone);
  position:relative;
}
.ref-thumb img{width:100%;height:100%;object-fit:cover}
.ref-sim{
  position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;
  font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 5px;border-radius:4px;
}

/* ── Credits pill ───────────────────────────────────────────────────── */
.cr-pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  background:var(--bone);border:1px solid var(--line);font-size:11px;
  font-family:'JetBrains Mono',monospace;color:var(--ink-soft);
}
.cr-pill.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);color:var(--paper)}

/* ── Toast ──────────────────────────────────────────────────────────── */
#toasts{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);
  width:calc(100% - 40px);max-width:390px;z-index:200;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;
  animation:slideDown .2s ease;pointer-events:auto;
}
.toast-err{background:#fff1f0;border:1px solid #ffa39e;color:#cf1322}
.toast-ok{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}

/* ── Chat msgs ──────────────────────────────────────────────────────── */
.chat-msg{
  padding:9px 12px;border-radius:10px;font-size:14px;max-width:85%;margin-bottom:7px;
  line-height:1.4;
}
.chat-msg.user{
  background:var(--ink);color:var(--paper);margin-left:auto;
  border-radius:10px 10px 2px 10px;
}
.chat-msg.sys{
  background:var(--bone);color:var(--ink-soft);
  border-radius:10px 10px 10px 2px;
}

/* ── Sticky CTA ─────────────────────────────────────────────────────── */
.sticky-cta{
  position:sticky;bottom:0;padding:12px 20px env(safe-area-inset-bottom,24px);
  background:rgba(251,248,242,.93);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);z-index:10;
}

/* ── Revision rail ──────────────────────────────────────────────────── */
.rev-rail{
  display:flex;gap:8px;padding:10px 14px;overflow-x:auto;
  background:rgba(28,27,23,.8);-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.rev-rail::-webkit-scrollbar{display:none}
.rev-thumb{
  width:52px;height:52px;border-radius:8px;border:2px solid transparent;
  overflow:hidden;flex-shrink:0;cursor:pointer;background:rgba(255,255,255,.1);
}
.rev-thumb.active{border-color:var(--clay)}
.rev-thumb img{width:100%;height:100%;object-fit:cover}

/* ── Generation screen ──────────────────────────────────────────────── */
.gen-screen{
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:28px;padding:40px 28px;background:var(--dark);
}
.gen-pulse{
  width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;
  animation:pulse 2s ease-in-out infinite;
}
.gen-step{
  display:flex;align-items:center;gap:10px;font-size:13px;
  color:rgba(255,255,255,.3);transition:color .3s;
}
.gen-step.active{color:var(--paper)}
.gen-step.done{color:rgba(255,255,255,.5)}
.gen-step-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);
  flex-shrink:0;transition:background .3s}
.gen-step.active .gen-step-dot{background:var(--clay)}
.gen-step.done .gen-step-dot{background:var(--olive)}

/* ── Profile ────────────────────────────────────────────────────────── */
.prow{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.prow:last-child{border-bottom:none}
.toggle{
  width:44px;height:26px;border-radius:13px;background:var(--line);
  position:relative;border:none;flex-shrink:0;transition:background .2s;cursor:pointer;
}
.toggle.on{background:var(--olive)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after{transform:translateX(18px)}

/* ── Session card ───────────────────────────────────────────────────── */
.sess-card{
  display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line);cursor:pointer;
  margin-bottom:10px;-webkit-tap-highlight-color:transparent;
}
.sess-card:active{opacity:.8}
.sess-thumb{
  width:72px;height:72px;border-radius:10px;background:var(--bone);
  overflow:hidden;flex-shrink:0;
}
.sess-thumb img{width:100%;height:100%;object-fit:cover}

/* ── Divider ────────────────────────────────────────────────────────── */
.divider{height:1px;background:var(--line);margin:16px 0}

/* ── Filter chips ───────────────────────────────────────────────────── */
.chip{
  padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--paper);
  font-size:12px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mute);white-space:nowrap;flex-shrink:0;
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.db-card-wrap{position:relative;overflow:visible}
.db-upload-pill{
  position:absolute;top:12px;right:12px;z-index:2;
  font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.1em;padding:8px 12px;border-radius:999px;
  background:var(--ink);color:var(--paper);border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.db-tile{
  padding:14px;border-radius:14px;border:1px solid var(--line);
  background:var(--paper);text-align:left;cursor:pointer;width:100%;
  box-shadow:0 2px 0 rgba(28,27,23,.04),0 1px 2px rgba(28,27,23,.06);
  -webkit-tap-highlight-color:transparent;
}
.db-tile:active{opacity:.88}
.db-empty{
  border:1px dashed var(--line);border-radius:12px;background:#FEFCF6;
  padding:36px 16px;text-align:center;
}
.db-back{
  display:flex;align-items:center;gap:8px;background:none;border:none;padding:6px 0;
  font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;
}
.db-row{display:flex;gap:12px;padding:12px;border:1px solid var(--bone-deep);border-radius:10px;background:var(--paper)}
.db-thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--line);background:var(--bone)}
.db-thumb img{width:100%;height:100%;object-fit:cover}
.spin{width:14px;height:14px;border:2px solid var(--olive);border-top-color:transparent;border-radius:50%;
  animation:spin .8s linear infinite;flex-shrink:0}

/* ── Room grid ──────────────────────────────────────────────────────── */
.room-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Keyframes ──────────────────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{
  from{transform:translateX(-50%) translateY(100%)}
  to{transform:translateX(-50%) translateY(0)}
}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(28,27,23,.15);border-radius:3px}
</style>
</head>

// ── API CLIENT ────────────────────────────────────────────────────────────────
async function apiReq(path, opts = {}) {
  const headers = {};
  const { data: { session } } = await sb.auth.getSession();
  if (session) headers['Authorization'] = `Bearer ${session.access_token}`;
  if (opts.json !== undefined) {
    headers['Content-Type'] = 'application/json';
    opts = { ...opts, body: JSON.stringify(opts.json) };
    delete opts.json;
  }
  const res = await fetch(`${API}${path}`, { ...opts, headers });
  if (!res.ok) {
    let b = {};
    try { b = await res.json(); } catch {}
    throw new Error(b.error || b.message || res.statusText || `HTTP ${res.status}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

const WH = {
  authMe:              ()  => apiReq('/auth/me'),
  uploadPhoto:         (file) => { const f=new FormData(); f.append('file',file); return apiReq('/uploads/room-photo',{method:'POST',body:f}); },
  generateOrchestrated:(a) => apiReq('/generate/orchestrated', { method:'POST', json:a }),
  generateEdit:        (a) => apiReq('/generate/edit',         { method:'POST', json:a }),
  generateCommit:      (a) => apiReq('/generate/commit',       { method:'POST', json:a }),
  listSessGens:        (id)=> apiReq(`/generations/session/${encodeURIComponent(id)}`),
  exportGen:           (id)=> apiReq(`/generations/${encodeURIComponent(id)}/export`, { method:'POST' }),
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
function absUrl(url) {
  if (!url) return '';
  if (/^https?:\/\//i.test(url)) return url;
  return `${API}${url.startsWith('/') ? '' : '/'}${url}`;
}
function revLabel(i) { return `Rev ${String(i+1).padStart(2,'0')}` }
function wait(ms) { return new Promise(r=>setTimeout(r,ms)) }
function uid() { return crypto.randomUUID?.() || `sess-${Date.now()}-${Math.random().toString(36).slice(2,7)}` }

function toast(msg, type='err') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const noTabs = ['landing','signin','new-upload','new-style','new-generating'];
  const darkBg = ['canvas','new-generating'];
  const dark   = darkBg.includes(S.screen);

  applyShellTheme(dark);
  updateTabBar(!noTabs.includes(S.screen));

  const view = document.getElementById('view');
  switch (S.screen) {
    case 'landing':        view.innerHTML = scrLanding();    afterLanding();    break;
    case 'signin':         view.innerHTML = scrSignIn();     afterSignIn();     break;
    case 'home':           view.innerHTML = scrHome();                          break;
    case 'new-upload':     view.innerHTML = scrNewUpload();                     break;
    case 'new-style':      view.innerHTML = scrNewStyle();   afterNewStyle();   break;
    case 'new-generating': view.innerHTML = scrGenerating(); startGeneration(); break;
    case 'canvas':         view.innerHTML = scrCanvas();                        break;
    case 'library':        view.innerHTML = scrLibrary();    afterLibrary();    break;
    case 'notifications':  view.innerHTML = scrNotifs();                        break;
    case 'profile':        view.innerHTML = scrProfile();                       break;
    default:               view.innerHTML = scrLanding();    afterLanding();    break;
  }
}

      <div class="anno" style="color:rgba(255,255,255,.4);margin-top:5px">
        ${S.flow.roomType} · ${S.flow.style}
      </div>
    </div>

      ${GEN_STEPS.map((s,i)=>`
        <div class="gen-step" id="gs${i}">
          <div class="gen-step-dot"></div>
          <span>${s}</span>
        </div>`).join('')}
    </div>
  </div>`;

async function startGeneration() {
  function stepActive(i) {
    const el = document.getElementById(`gs${i}`);
    if (!el) return;
    el.classList.add('active');
    el.querySelector('.gen-step-dot').style.background = 'var(--clay)';
    el.querySelector('span').style.color = 'var(--paper)';
  }
  function stepDone(i) {
    const el = document.getElementById(`gs${i}`);
    if (!el) return;
    el.classList.remove('active'); el.classList.add('done');
    el.querySelector('.gen-step-dot').style.background = 'var(--olive)';
    el.querySelector('span').style.color = 'rgba(255,255,255,.45)';
  }

  stepActive(0);
  try {
    const sessionId = uid();

    stepDone(0); stepActive(1);
    await wait(200);
    stepDone(1); stepActive(2);

    // Single orchestrated call — retrieval + generation in one webhook
    const draft = await WH.generateOrchestrated({
      upload_id:  S.flow.uploadId,
      brief:      S.flow.prompt || `${S.flow.style} ${S.flow.roomType}`,
      style_tag:  S.flow.style,
      room_type:  REF_CANONICAL_ROOM[S.flow.roomType] || S.flow.roomType,
      session_id: sessionId,
    });

    stepDone(2); stepActive(3);
    await wait(200);
    stepDone(3);

    // Commit to state
    S.sess = {
      id:       sessionId,
      roomType: S.flow.roomType,
      style:    S.flow.style,
      revisions: [{
        id: draft.generation_id, kind:'draft',
        url: absUrl(draft.output_url || draft.image_url),
        parentId: null, createdAt: Date.now(), modelId: draft.model_id,
      }],
      currentId:  draft.generation_id,
      references: (draft.refs_used || []).map(r=>({id:r.id, url:absUrl(r.url), similarity:r.similarity, tags:r.style_tags})),
      chat: [],
    };
    S.credits = Math.max(0, S.credits - 2);
    savePersist();

    await wait(180);
    S.tab = 'canvas'; go('canvas');
  } catch(e) {
    toast('Generation failed: ' + e.message);
    S.tab = 'home'; go('home');
  }
}

async function sendEdit() {
  const inp = document.getElementById('edit-in');
  const instruction = inp?.value.trim();
  if (!instruction) return;
  if (!S.sess.currentId) { toast('No revision to edit'); return; }

  inp.value = ''; inp.disabled = true;
  S.sess.chat.push({ role:'user', text:instruction });
  const log = document.getElementById('chat-log');
  if (log) {
    if (log.querySelector('div[style*="margin-top:24px"]')) log.innerHTML = '';
    log.innerHTML += `<div class="chat-msg user">${instruction}</div>`;
    log.innerHTML += `<div class="chat-msg sys" id="typing">
      <span class="spin" style="width:12px;height:12px;display:inline-block"></span></div>`;
    log.scrollTop = log.scrollHeight;
  }

  try {
    const r = await WH.generateEdit({
      generation_id: S.sess.currentId,
      instruction,
      session_id: S.sess.id,
    });
    const newRev = {
      id: r.generation_id, kind:'edit',
      url: absUrl(r.output_url),
      parentId: S.sess.currentId, createdAt: Date.now(), modelId: r.model_id,
    };
    S.sess.revisions.push(newRev);
    S.sess.currentId = r.generation_id;
    S.sess.chat.push({ role:'sys', text:`Edit applied — ${revLabel(S.sess.revisions.length-1)}` });
    S.credits = Math.max(0, S.credits - 1);
    savePersist();
    closeSheet(); go('canvas');
  } catch(e) {
    toast('Edit failed: ' + e.message);
    if (inp) inp.disabled = false;
    document.getElementById('typing')?.remove();
  }
}

  try {
    const r = await WH.generateCommit({
      generation_id: S.sess.currentId,
      session_id: S.sess.id,

    S.sess.revisions.push({
      id: r.generation_id, kind:'commit',
      url: absUrl(r.output_url),
      parentId: S.sess.currentId, createdAt: Date.now(), modelId: r.model_id,
    });
    S.sess.currentId = r.generation_id;
    S.credits = Math.max(0, S.credits - 3);

    toast('Commit complete!', 'ok');
    closeSheet(); go('canvas');

/** Disjoint style tag sets — same as frontend referenceCatalog (no shared minimalist, etc.). */
const REF_STYLE_ALIASES = {
  scandinavian: ['scandinavian', 'scandi', 'nordic'],
  japandi: ['japandi', 'japanese'],
  midcentury: ['midcentury', 'mid-century-modern', 'mid century modern', 'mcm'],
  traditional: ['traditional', 'classic', 'neo-contemporary', 'farmhouse'],
  industrial: ['industrial', 'loft', 'futuristic'],
  boho: ['boho', 'bohemian', 'eclectic', 'rustic', 'modern-ethnic-fusion', 'biophilic'],
};
function refStyleTagsFor(st) {
  return REF_STYLE_ALIASES[st] || [st];
}
const REF_CANONICAL_ROOM = {
  bedroom: 'bedroom',
  kids: 'kids room',
  dining: 'dining room',
  kitchen: 'kitchen',
  mandir: 'mandir',
  living: 'living room',
};

function dbStyleLabel(id) { const x = DB_STYLES.find(a => a[0] === id); return x ? x[1] : id; }
function dbRoomLabel(id) { const x = DB_ROOMS.find(a => a[0] === id); return x ? x[1] : id; }
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/"/g, '&quot;');
}
function refDisplayCaption(row) {
  const c = (row.caption || '').trim();
  return c;
}

async function dbFetchStyleCounts() {
  S.db.stylesLoading = true;
  S.db.listError = '';
  render();
  try {
    const o = {};
    for (const [id] of DB_STYLES) {
      const { count, error } = await sb.from('reference_images')
        .select('*', { count: 'exact', head: true })
        .overlaps('style_tags', refStyleTagsFor(id));
      if (error) throw error;
      o[id] = count ?? 0;
    }
    S.db.styleCounts = o;
  } catch (e) {
    S.db.listError = e.message || String(e);
  } finally {
    S.db.stylesLoading = false;
    render();
  }
}

async function dbFetchRoomCounts() {
  const st = S.db.style;
  S.db.roomsLoading = true;
  S.db.listError = '';
  render();
  try {
    const o = {};
    for (const [rid] of DB_ROOMS) {
      const variants = REF_ROOM_VARIANTS[rid] || [rid];
      const { count, error } = await sb.from('reference_images')
        .select('*', { count: 'exact', head: true })
        .in('room_type', variants)
        .overlaps('style_tags', refStyleTagsFor(st));
      if (error) throw error;
      o[rid] = count ?? 0;
    }
    S.db.roomCounts = o;
  } catch (e) {
    S.db.listError = e.message || String(e);
  } finally {
    S.db.roomsLoading = false;
    render();
  }
}

async function dbFetchDetailRows() {
  const st = S.db.style, rm = S.db.room;
  const variants = REF_ROOM_VARIANTS[rm] || [rm];
  S.db.detailLoading = true;
  S.db.listError = '';
  render();
  try {
    const { data, error } = await sb.from('reference_images')
      .select('id, source_url, storage_path, caption, room_type, style_tags, dominant_colors, detected_objects, quality_score, created_at, source, source_id, owner_id, owner_email')
      .in('room_type', variants)
      .overlaps('style_tags', refStyleTagsFor(st))
      .order('created_at', { ascending: false });
    if (error) throw error;
    S.db.detailRows = data || [];
  } catch (e) {
    S.db.listError = e.message || String(e);
    S.db.detailRows = [];
  } finally {
    S.db.detailLoading = false;
    render();
  }
}

function setProfilePanel(panel) {
  S.profilePanel = panel;
  if (panel === 'database') {
    S.db.step = 'styles';
    render();
    dbFetchStyleCounts();
  } else {
    render();
  }
}
function dbNavRooms(styleId) {
  S.db.style = styleId;
  S.db.step = 'rooms';
  render();
  dbFetchRoomCounts();
}
function dbNavDetail(roomId) {
  S.db.room = roomId;
  S.db.step = 'detail';
  render();
  dbFetchDetailRows();
}
function dbBackToStyles() {
  S.db.step = 'styles';
  render();
  dbFetchStyleCounts();
}
function dbBackToRooms() {
  S.db.step = 'rooms';
  render();
  dbFetchRoomCounts();
}
function dbPickFiles() {
  if (!S.jwt) { toast('Sign in to upload', 'err'); return; }
  const el = document.getElementById('db-file-input');
  if (el) el.click();
}

async function dbFilesPicked(ev) {
  if (!S.jwt) { toast('Sign in to upload', 'err'); ev.target.value = ''; return; }
  const files = ev.target.files;
  if (!files || !files.length) return;
  const st = S.db.style, rm = S.db.room;

  const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  ev.target.value = '';
  if (!imageFiles.length) return;

  S.db.uploading = true;
  S.db.listError = '';
  S.db.uploadProgress = imageFiles.map((f, i) => ({ index: i, filename: f.name, status: 'uploading' }));
  render();

  try {
    const fileData = await Promise.all(imageFiles.map(f => new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = e => res({ filename: f.name, content_b64: e.target.result.split(',')[1], mime: f.type || 'image/jpeg' });
      reader.onerror = rej;
      reader.readAsDataURL(f);
    })));

    const { results } = await apiReq('/uploads/reference/bulk', {
      method: 'POST',
      json: { style_tag: st, room_type: rm, files: fileData },
    });

    S.db.uploadProgress = results.map(r => ({
      index: r.file_index,
      filename: imageFiles[r.file_index]?.name || `file ${r.file_index}`,
      status: r.status,
      error: r.error,
      caption_preview: r.caption_preview,
    }));

    const failed = results.filter(r => r.status !== 'ok').length;
    if (failed > 0) S.db.listError = `${failed} of ${results.length} file(s) failed — see details below.`;
    await dbFetchDetailRows();
  } catch (e) {
    S.db.listError = e.message || String(e);
    S.db.uploadProgress = [];
  } finally {
    S.db.uploading = false;
    render();
  }
}

async function dbDeleteRef(rowId) {
  if (!S.jwt) { toast('Sign in to delete', 'err'); return; }
  if (!confirm('Remove this image from the catalog?')) return;
  const row = S.db.detailRows.find(r => r.id === rowId);
  if (!row) return;
  S.db.deletingId = rowId;
  S.db.listError = '';
  render();
  try {
    const { error: dErr } = await sb.from('reference_images').delete().eq('id', row.id);
    if (dErr) throw dErr;
    await sb.storage.from('reference-images').remove([row.storage_path]);
    S.db.detailRows = S.db.detailRows.filter(r => r.id !== rowId);
  } catch (e) {
    S.db.listError = e.message || String(e);
  } finally {
    S.db.deletingId = null;
    render();
  }
}

function scrProfileDatabase() {
  const step = S.db.step || 'styles';
  const st = S.db.style, rm = S.db.room;
  const rows = S.db.detailRows || [];
  const errBanner = S.db.listError
    ? `<div class="card" style="padding:10px;margin-bottom:12px;font-size:12px;color:#b44;line-height:1.4">${escHtml(S.db.listError)}</div>`
    : '';

  const rowHtml = rows.map(row => {
    const cap = refDisplayCaption(row);
    const tags = [...new Set([...(row.style_tags || []), row.room_type].filter(Boolean))];
    const tagHtml = tags.map(t =>
      `<span class="anno" style="display:inline-block;margin:2px 4px 0 0;padding:2px 8px;border-radius:999px;background:var(--line);text-transform:none;font-size:11px">${escHtml(t)}</span>`
    ).join('');
    const delBusy = S.db.deletingId === row.id;
    const fname = row.storage_path ? String(row.storage_path).split('/').pop() : '';
    const ownerLine = row.owner_email
      ? `<div class="anno" style="text-transform:none;font-size:11px;margin-bottom:4px">owner · ${escHtml(row.owner_email)}</div>`
      : `<div class="anno" style="text-transform:none;font-size:11px;margin-bottom:4px;color:var(--mute)">shared catalog</div>`;
    const meta = [row.quality_score != null ? `quality ${row.quality_score}` : '', fname].filter(Boolean).join(' · ');
    const objArr = Array.isArray(row.detected_objects) ? row.detected_objects : [];
    const objs = objArr.length
      ? `<div class="anno" style="text-transform:none;font-size:11px;margin-top:4px">${escHtml(objArr.slice(0, 6).join(', '))}</div>`
      : '';
    return `<div class="db-row">
      <div class="db-thumb">${row.source_url ? `<img src="${escHtml(row.source_url)}" alt="">` : ''}</div>
      <div style="flex:1;min-width:0">
        ${tagHtml ? `<div style="margin-bottom:6px">${tagHtml}</div>` : ''}
        ${cap ? `<div style="font-size:12px;color:var(--ink-soft);line-height:1.45;margin-bottom:6px">${escHtml(cap)}</div>` : ''}
        ${ownerLine}
        ${meta ? `<div class="anno" style="text-transform:none;font-size:11px;margin-bottom:4px">${escHtml(meta)}</div>` : ''}
        ${objs}
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          ${delBusy ? '<span class="spin"></span><span class="anno" style="text-transform:none">removing…</span>' :
            `<button type="button" class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="dbDeleteRef('${row.id}')" ${S.jwt && row.owner_id && row.owner_id === S.userId ? '' : 'disabled'} title="${row.owner_id && row.owner_id === S.userId ? '' : 'Only your own uploads can be deleted'}">Delete</button>`}
        </div>
      </div>
    </div>`;
  }).join('');

  if (step === 'styles') {
    const grid = DB_STYLES.map(([id, name, desc]) => {
      const n = S.db.styleCounts[id];
      const badge = typeof n === 'number'
        ? `<div class="anno" style="margin-top:8px;text-transform:none">${n} image${n === 1 ? '' : 's'}</div>`
        : (S.db.stylesLoading ? `<div class="anno" style="margin-top:8px;text-transform:none">…</div>` : '');
      return `
      <button type="button" class="db-tile" onclick="dbNavRooms('${id}')">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--line)"></span>
          <span class="serif" style="font-size:17px">${name}</span>
        </div>
        <div class="anno" style="text-transform:none;line-height:1.35">${desc}</div>
        ${badge}
      </button>`;
    }).join('');
    return `
      ${errBanner}
      <div class="anno" style="margin-bottom:8px">reference dataset</div>
      <div style="font-size:13px;color:var(--mute);line-height:1.45;margin-bottom:14px">
        Live data from Supabase (<code style="font-size:11px">reference_images</code>). Sign in to upload or delete.
      </div>
      <div class="anno" style="margin-bottom:10px">◆ interior style</div>
      <div class="style-grid">${grid}</div>`;
  }

  if (step === 'rooms') {
    const grid = DB_ROOMS.map(([id, name, sub]) => {
      const n = S.db.roomCounts[id];
      const badge = typeof n === 'number'
        ? `<div class="anno" style="margin-top:8px;text-transform:none">${n} image${n === 1 ? '' : 's'}</div>`
        : (S.db.roomsLoading ? `<div class="anno" style="margin-top:8px;text-transform:none">…</div>` : '');
      return `
      <button type="button" class="db-tile" onclick="dbNavDetail('${id}')">
        <div class="serif" style="font-size:17px;margin-bottom:4px">${name}</div>
        <div class="anno" style="text-transform:none;line-height:1.35">${sub}</div>
        ${badge}
      </button>`;
    }).join('');
    return `
      ${errBanner}
      <button type="button" class="db-back" onclick="dbBackToStyles()">← All styles</button>
      <div class="anno" style="margin-top:8px;margin-bottom:4px">room type</div>
      <div class="serif" style="font-size:24px;line-height:1.15;margin-bottom:6px">${dbStyleLabel(st)}</div>
      <div style="font-size:13px;color:var(--mute);line-height:1.45;margin-bottom:14px">
        Open a room to see reference images for this style.
      </div>
      <div class="style-grid">${grid}</div>`;
  }

  const rmMeta = DB_ROOMS.find(a => a[0] === rm);
  const sub = rmMeta ? rmMeta[2] : '';
  const uploadDim = !S.jwt || S.db.uploading;
  let empty;
  if (S.db.detailLoading && !rows.length) {
    empty = `<div class="db-empty"><span class="spin"></span><div class="anno" style="margin-top:10px;text-transform:none">Loading images…</div></div>`;
  } else if (!rows.length) {
    empty = `
    <div class="db-empty">
      <div class="serif" style="font-size:18px;margin-bottom:8px">No images yet</div>
      <div class="anno" style="text-transform:none;line-height:1.45;max-width:280px;margin:0 auto">
        Sign in and use Upload new; files go under <code style="font-size:11px">studio/&lt;your-id&gt;/${st}/${rm}/</code>.
      </div>
    </div>`;
  } else {
    empty = `
    <div class="anno" style="margin-bottom:10px">library · ${rows.length} image${rows.length === 1 ? '' : 's'}</div>
    ${rowHtml}`;
  }

  const progItems = S.db.uploadProgress || [];
  const progHtml = progItems.length ? `
    <div style="margin-top:12px;margin-bottom:4px">
      ${progItems.map(p => {
        const icon = p.status === 'ok' ? '✓' : p.status === 'error' ? '✗' : '…';
        const col  = p.status === 'ok' ? '#3a7' : p.status === 'error' ? '#b44' : 'var(--mute)';
        return `<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px">
          <span style="color:${col};font-weight:600;flex-shrink:0">${icon}</span>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(p.filename)}</span>
          ${p.error ? `<span style="color:#b44;font-size:11px;flex-shrink:0">${escHtml(p.error)}</span>` : ''}
        </div>`;
      }).join('')}
    </div>` : '';

  return `
    ${errBanner}
    <button type="button" class="db-back" onclick="dbBackToRooms()" style="padding-right:100px">← ${dbStyleLabel(st)}</button>
    <button type="button" class="db-upload-pill" onclick="dbPickFiles()" style="${uploadDim ? 'opacity:0.45;pointer-events:none' : ''}">${S.db.uploading ? 'Uploading…' : 'Upload new'}</button>
    <div style="padding-right:4px;margin-top:4px">
      <div class="anno">${dbStyleLabel(st)}</div>
      <div class="serif" style="font-size:24px;line-height:1.15;margin-top:2px">${dbRoomLabel(rm)}</div>
      <div style="font-size:12px;color:var(--mute);margin-top:4px">${sub}</div>
    </div>
    <input type="file" id="db-file-input" multiple accept="image/jpeg,image/png,image/webp" style="display:none" onchange="dbFilesPicked(event)">
    ${progHtml}
    <div style="margin-top:16px">${empty}</div>`;
}

// SCREEN: PROFILE
// ════════════════════════════════════════════════════════════════════════
function scrProfile() {
  const initial = (S.email || 'D')[0].toUpperCase();
  const panel = S.profilePanel || 'account';
  const chips = `
    <div class="chip-row" style="margin-bottom:4px">
      <button type="button" class="chip ${panel === 'account' ? 'active' : ''}" onclick="setProfilePanel('account')">Account</button>
      <button type="button" class="chip ${panel === 'database' ? 'active' : ''}" onclick="setProfilePanel('database')">Database</button>
    </div>`;

  const accountBlock = `
      <!-- Identity -->
      <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--olive);
            display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span class="serif" style="color:var(--paper);font-size:20px">${initial}</span>
        </div>
        <div style="flex:1;min-width:0">
          <div class="serif" style="font-size:18px;word-break:break-all">${S.email || 'Demo User'}</div>
          <div class="anno" style="margin-top:2px">member · atelier studio</div>
        </div>
      </div>

      <!-- Wallet -->
      <div class="card" style="padding:16px">
        <div class="anno" style="margin-bottom:10px">wallet</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
          <span class="serif" style="font-size:40px;line-height:1">${S.credits}</span>
          <span style="color:var(--mute);font-size:14px">credits</span>
        </div>
        <div class="anno" style="margin-bottom:12px">1 draft = 2 cr · 1 edit = 1 cr · 1 commit = 3 cr</div>
        <div style="display:flex;gap:8px">
          ${[[100,20],[500,100],[1000,200]].map(([inr,cr])=>`
            <button class="btn btn-ghost" style="flex:1;flex-direction:column;gap:2px;
                padding:8px 6px;border-radius:10px;font-size:12px"
                onclick="topUp(${inr},${cr})">
              +${cr} cr<br>
              <span class="anno" style="text-transform:none;color:var(--mute)">₹${inr}</span>
            </button>`).join('')}
        </div>
      </div>

      <!-- Usage stats -->
      <div class="card" style="padding:16px">
        <div class="anno" style="margin-bottom:12px">usage</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
          ${[['Drafts','${S.sess.revisions.filter(r=>r.kind==="draft").length}'],
             ['Edits','${S.sess.revisions.filter(r=>r.kind==="edit").length}'],
             ['Commits','${S.sess.revisions.filter(r=>r.kind==="commit").length}']].map(([l,v])=>`
            <div>
              <div class="serif" style="font-size:24px;line-height:1">${eval(v.replace(/\$/g,''))}</div>
              <div class="anno" style="margin-top:3px">${l}</div>
            </div>`).join('')}
        </div>
      </div>

      <!-- Notification prefs -->
      <div class="card" style="padding:16px">
        <div class="anno" style="margin-bottom:10px">notifications</div>
        ${[
          ['lowBalance',  'Low balance alerts',  'Ping when credits drop below a commit.'],
          ['commitDone',  'Commit complete',      'High-fidelity render finished.'],
          ['features',    'Product updates',      'New models and capabilities.'],
          ['storage',     'Storage invoices',     'Monthly storage charges.'],
        ].map(([k,title,sub])=>`
          <div class="prow">
            <div style="flex:1">
              <div style="font-size:14px">${title}</div>
              <div style="font-size:12px;color:var(--mute);margin-top:2px">${sub}</div>
            </div>
            <button class="toggle ${S.notifPrefs[k]?'on':''}" id="tog-${k}"
              onclick="togPref('${k}',this)"></button>
          </div>`).join('')}
      </div>

      <!-- Account -->
      <div class="card" style="padding:16px">
        <div class="anno" style="margin-bottom:10px">account</div>
        <button class="btn btn-ghost btn-full" onclick="signOut()">Sign out</button>
      </div>`;

  const body = panel === 'database'
    ? `<div class="card db-card-wrap" style="padding:16px">${scrProfileDatabase()}</div>`
    : accountBlock;

  return `<div style="min-height:100%;padding-bottom:100px">
    <div class="mob-nav">
      <div style="flex:1">
        <div class="mob-nav-sub">atelier · account</div>
        <div class="mob-nav-title">Profile</div>
      </div>
      <button onclick="go('notifications')"
          style="position:relative;background:none;border:none;padding:4px">
        ${IC.notif}
        ${S.unread>0?`<span style="position:absolute;top:0;right:0;width:8px;height:8px;
          border-radius:50%;background:var(--clay);border:1.5px solid var(--paper)"></span>`:''}
      </button>
    </div>

    <div style="padding:20px;display:flex;flex-direction:column;gap:16px">
      ${chips}
      ${body}
    </div>
  </div>`;
}

function togPref(key, btn) {
  S.notifPrefs[key] = !S.notifPrefs[key];
  btn.classList.toggle('on', S.notifPrefs[key]);
  savePersist();
}

function topUp(inr, cr) {
  S.credits += cr; savePersist();
  toast(`+${cr} credits added!`, 'ok');
  go('profile');
}

async function signOut() {
  await sb.auth.signOut();
  S.jwt = ''; S.userId = ''; S.email = ''; S.credits = 24;
  S.sess = { id:null,roomType:null,style:null,revisions:[],currentId:null,references:[],chat:[] };
  S.profilePanel = 'account';
  S.db = {
    step: 'styles', style: 'scandinavian', room: 'bedroom',
    styleCounts: {}, roomCounts: {}, detailRows: [],
    stylesLoading: false, roomsLoading: false, detailLoading: false,
    listError: '', uploading: false, deletingId: null,
  };
  savePersist(); go('landing');
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
S.tab = 'home';
S.screen = 'landing'; // show landing while session resolves
render();

sb.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    S.jwt = session.access_token;
    S.userId = session.user.id;
    S.email  = session.user.email || '';
    S.screen = 'home';
    render();
  }
});

sb.auth.onAuthStateChange((_event, session) => {
  if (session) {
    S.jwt = session.access_token;
    S.userId = session.user.id;
    S.email  = session.user.email || '';
    if (S.screen === 'landing' || S.screen === 'signin') {
      S.screen = 'home'; render();
    }
  } else {
    S.jwt = ''; S.userId = ''; S.email = '';
    S.screen = 'landing'; render();
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
